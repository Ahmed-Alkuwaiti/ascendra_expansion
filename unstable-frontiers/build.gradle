plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '[2.0.0,2.1)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
            // The pack server test loads all of Integrated Boogaloo's server-side mods.
            jvmArgument '-Xmx6G'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client {
            client()
            // its own folder, so a client test never disturbs the server test's world and mods
            gameDirectory = project.file('run_client')
            jvmArgument '-Xmx8G'
            // CI screenshots (ci/pack_client.sh): straight into the prepared world, at a fixed window size
            if (System.getenv('UF_SHOTS')) {
                programArgument '--quickPlaySingleplayer'
                programArgument 'world'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Fill the ${...} placeholders in neoforge.mods.toml from gradle.properties so the versions live in one place.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
            mod_license: mod_license, mod_version: mod_version, geckolib_version: geckolib_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

// GeckoLib animates the frontier's creatures. It is not bundled: Integrated Boogaloo ships it (Antarchy needs it too).
// When the pack has been downloaded (CI), compile against the very jar the pack ships; otherwise use the same version
// from GeckoLib's Maven.
dependencies {
    def packGecko = fileTree(dir: 'pack/mods', include: "geckolib-neoforge-${minecraft_version}-${geckolib_version}.jar")
    if (!packGecko.isEmpty()) {
        compileOnly packGecko
    } else {
        compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
