modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Ahmed Alkuwaiti"
description='''
An adventure expansion for the Integrated Boogaloo modpack (1.0.8): the Unstable Frontier, a wilderness of cage towers,
a hanging gaol, rookeries, brood hives, carrion fields and the Great Cage, fought with Antarchy's creatures. Requires
Antarchy; it never substitutes other creatures.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required: every fight is built from Antarchy's creatures, and the Brood Hive uses its chitin blocks. Without it NeoForge
# stops at the loading screen and names the missing mod. Load after it so its entity types are registered first.
[[dependencies.${mod_id}]]
    modId="antarchy"
    type="required"
    versionRange="[2.2.9,)"
    ordering="AFTER"
    side="BOTH"

# Required: the frontier's own creatures are GeckoLib models (Integrated Boogaloo ships GeckoLib 4.9.3).
[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"
