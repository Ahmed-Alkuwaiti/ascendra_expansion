name: Integrated Boogaloo pack probe

on:
  push:
    paths:
      - 'unstable-frontiers/ci/pack/**'
      - '.github/workflows/pack_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: unstable-frontiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pack and every mod in it
        run: python3 ci/pack/fetch_pack.py pack
      - name: Pack details the addon depends on
        run: python3 ci/pack/details.py pack
      - name: What the pack contains
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 ci/pack/inspect_jars.py pack/mods
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-report
          path: unstable-frontiers/pack/report.txt
          if-no-files-found: ignore
