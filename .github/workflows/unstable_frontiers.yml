name: Build Unstable Frontiers

on:
  push:
    paths:
      - 'unstable-frontiers/**'
      - '.github/workflows/unstable_frontiers.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: unstable-frontiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone data checks (references, models, lang, sounds)
        run: |
          pip install --quiet nbtlib
          python3 tools/check_data.py
      - name: Build
        run: |
          set -o pipefail
          timeout 2400 gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Summarise the errors
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "error:|warning: \[removal\]|What went wrong|Could not|> " -A3 build.log | grep -v "^--$" | head -400
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: unstable-frontiers-jar
          path: unstable-frontiers/build/libs/*.jar
          if-no-files-found: error
      - name: Without Antarchy the server stops with an actionable error
        run: bash ci/smoke.sh
      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unstable-frontiers-server-log
          path: |
            unstable-frontiers/run/logs/latest.log
            unstable-frontiers/server_console.log
          if-no-files-found: ignore
