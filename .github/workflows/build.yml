name: Build the mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log
      - name: Summarise the errors
        if: failure()
        run: |
          echo "==== ERRORS ===="
          grep -E "error:|warning: \[removal\]|What went wrong|Could not|> " -A3 build.log | grep -v "^--$" | head -400
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
