name: Integrated Boogaloo server test

on:
  push:
    paths:
      - 'unstable-frontiers/**'
      - '.github/workflows/pack_server.yml'
  workflow_dispatch:

jobs:
  pack-server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: unstable-frontiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
      - name: Cache the pack download
        uses: actions/cache@v4
        with:
          path: unstable-frontiers/pack
          key: integrated-boogaloo-1.0.8-v1
      - name: Fetch Integrated Boogaloo (skipped when cached)
        run: test -f pack/manifest.json || python3 ci/pack/fetch_pack.py pack
      - name: Build
        run: gradle build --no-daemon --console=plain
      - name: Server with the pack's mods
        run: bash ci/pack_server.sh
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-server-logs
          path: |
            unstable-frontiers/run/logs/latest.log
            unstable-frontiers/server_console.log
            unstable-frontiers/pack_selection.txt
          if-no-files-found: ignore
