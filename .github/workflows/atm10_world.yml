name: ATM10 world converter

on:
  push:
    paths:
      - 'tools/atm10_world/**'
      - '.github/workflows/atm10_world.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download vanilla 1.20.1 and 1.21.1 servers
        run: |
          set -e
          m=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          for v in 1.20.1 1.21.1; do
            meta=$(echo "$m" | jq -r --arg v "$v" '.versions[] | select(.id==$v) | .url')
            url=$(curl -s "$meta" | jq -r '.downloads.server.url')
            mkdir -p "s$v" && curl -s -o "s$v/server.jar" "$url"
            echo "eula=true" > "s$v/eula.txt"
          done
      - name: Generate a 1.20.1 world
        working-directory: s1.20.1
        run: |
          printf 'level-seed=12345\nonline-mode=false\n' > server.properties
          echo stop | java -Xmx2G -jar server.jar nogui
      - name: Add fake mod content, then clean it
        run: |
          python3 -I tools/atm10_world/ci_inject.py s1.20.1/world
          python3 -I tools/atm10_world/clean_world.py s1.20.1/world s1.21.1/world
      - name: Open the cleaned world in 1.21.1 and upgrade every chunk
        working-directory: s1.21.1
        run: |
          printf 'online-mode=false\n' > server.properties
          echo stop | java -Xmx2G -jar server.jar --forceUpgrade nogui 2>&1 | tee upgrade.log
          if grep -E "Couldn't load chunk|Failed to (load|read)|Exception|Unknown registry|missing" upgrade.log; then
            echo "::error::the cleaned world did not load cleanly"; exit 1
          fi
          grep -q "Done (" upgrade.log
