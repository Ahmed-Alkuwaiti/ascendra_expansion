name: Integrated Boogaloo client screenshots

# The whole pack's client under Xvfb (software OpenGL) opens a prepared world and takes the screenshots scripted in
# unstable-frontiers/ci/client_shots.txt. They are committed to unstable-frontiers/docs/screenshots/ingame on the same
# branch (a push made with GITHUB_TOKEN starts no other workflow).
on:
  push:
    paths:
      - 'unstable-frontiers/ci/client_shots.txt'
      - 'unstable-frontiers/ci/pack_client.sh'
      - '.github/workflows/pack_client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-client:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: unstable-frontiers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
      - name: Software OpenGL and a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
      - name: Restore the pack download
        id: pack
        uses: actions/cache/restore@v4
        with:
          path: unstable-frontiers/pack
          key: integrated-boogaloo-1.0.8-v1
      - name: Fetch Integrated Boogaloo (skipped when cached)
        if: steps.pack.outputs.cache-hit != 'true'
        run: python3 ci/pack/fetch_pack.py pack
      - name: Build
        run: gradle build --no-daemon --console=plain
      - name: World, then the client and its screenshots
        run: bash ci/pack_client.sh
      - name: Commit the screenshots
        if: always()
        run: |
          shopt -s nullglob
          shots=(run_client/screenshots/*.png)
          [ ${#shots[@]} -gt 0 ] || { echo "no screenshots"; exit 0; }
          mkdir -p docs/screenshots/ingame
          rm -f docs/screenshots/ingame/*.png
          for f in "${shots[@]}"; do
            python3 -c "from PIL import Image" 2>/dev/null || pip install --quiet pillow
            python3 -c "import sys; from PIL import Image; Image.open(sys.argv[1]).convert('RGB').save(sys.argv[2], optimize=True)" "$f" "docs/screenshots/ingame/$(basename "$f")"
          done
          grep -E "SHOTS|ERROR" run_client/logs/latest.log | cut -c1-300 | head -400 > docs/screenshots/ingame/client_log_excerpt.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ingame
          git commit -qm "In-game screenshots from the pack client (CI run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-client-logs
          path: |
            unstable-frontiers/run_client/logs/latest.log
            unstable-frontiers/client_console.log
            unstable-frontiers/run/logs/latest.log
          if-no-files-found: ignore
